<script>
/*__CORE_START__*/
// ============================================================
// 纯数据层（与 dashboard_server.py 的 list_tasks / get_task_detail 等价）
// 输入：一个 .jsonl 的全文；输出：任务概要 + 决策链明细
// ============================================================
function esc(s){
  return String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }

// 解析 JSONL 全文 -> 事件数组（跳过空行/坏行）
function parseEvents(text){
  const out = [];
  String(text).split(/\r?\n/).forEach(ln => {
    if(!ln.trim()) return;
    try { out.push(JSON.parse(ln)); } catch(e) {}
  });
  return out;
}

// 空行数（用于「没有 finish 事件」时近似步数，对齐后端口径）
function nonEmptyLines(text){
  return String(text).split(/\r?\n/).filter(ln => ln.trim()).length;
}

// 任务概要：从 finish 事件取 status / 步数 / token / 耗时
function buildSummary(stem, evs, lineCount){
  let status = 'running', total_steps = 0, total_tokens = 0, total_time = 0;
  evs.forEach(ev => {
    if(ev.phase === 'finish'){
      status = (ev.success === false) ? 'aborted' : 'done';
      total_time  = num(ev.elapsed ?? ev.t);
      const u = ev.usage || {};
      total_tokens = Math.trunc(num(u.total_tokens));
      total_steps  = Math.trunc(num(ev.steps));
    }
  });
  if(status === 'running'){
    total_steps = new Set(evs.filter(ev => Number.isInteger(ev.step) && ev.step > 0).map(ev => ev.step)).size;
    total_time = Math.max(0, ...evs.map(ev => num(ev.t)));
  }
  return {
    task_dir: stem, session_id: stem, task: stem,
    status: status,
    total_steps: total_steps,
    total_time: Math.round(total_time * 10) / 10,
    total_tokens: total_tokens
  };
}

// 决策链明细：每条事件一张卡片（finish 只用于汇总，不单独成卡）
function buildDetail(stem, evs){
  let status = 'running', finishUsage = {}, finishSteps = 0, finishTime = null, steps = [], prevT = 0;
  const stepCounts = {};
  // 任务开始墙钟时刻（文件名末尾 -YYYYMMDD-HHMMSS）：旧日志无 wall 字段时用 t 偏移还原 HH:MM:SS
  const stampM = String(stem).match(/-(\d{8})-(\d{6})$/);
  let startMs = 0;
  if(stampM){
    const d = stampM[1], c = stampM[2];
    startMs = new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8),
                       +c.slice(0,2), +c.slice(2,4), +c.slice(4,6)).getTime();
  }

  evs.forEach((ev, idx) => {
    const phase = ev.phase || 'log';
    const msg   = ev.msg || '';
    let stepNo  = (typeof ev.step === 'number') ? ev.step : idx;

    if(phase === 'finish'){
      status = (ev.success === false) ? 'aborted' : 'done';
      finishUsage = ev.usage || {};
      // 真实步数取自 finish 顶层 steps（与概况口径一致）；usage 里没有 steps。
      finishSteps = Math.trunc(num(ev.steps));
      finishTime = num(ev.elapsed ?? ev.t);
      return;
    }
    stepCounts[stepNo] = (stepCounts[stepNo] || 0) + 1;

    // 事件自带指标（路由 / 屏幕指纹 / 调用次数 …）-> 卡片 detail
    const metrics = {};
    Object.keys(ev).forEach(k => {
      if(k !== 't' && k !== 'wall' && k !== 'step' && k !== 'phase' && k !== 'msg') metrics[k] = ev[k];
    });

    // token 兼容 int 或 {input,output}
    const tok = metrics.tokens;
    let tokenD = {input:0, output:0};
    if(tok && typeof tok === 'object'){
      tokenD = {input: Math.trunc(num(tok.input)), output: Math.trunc(num(tok.output))};
    } else if(typeof tok === 'number'){
      tokenD = {input: Math.trunc(tok), output: 0};
    }

    const t  = num(ev.t);
    const dt = prevT ? Math.round((t - prevT) * 100) / 100 : 0;
    prevT = t;

    // 每步墙钟时间（HH:MM:SS）：优先事件自带 wall（新版日志），否则 起始时刻 + t 还原
    let wallTime = (typeof ev.wall === 'string' && ev.wall) ? ev.wall : '';
    if(!wallTime && startMs) wallTime = new Date(startMs + t * 1000).toTimeString().slice(0, 8);

    steps.push({
      step: stepNo,
      substep: stepCounts[stepNo],
      wall_time: wallTime || null,
      action: Object.assign({action: phase, summary: msg, explain: msg}, metrics),
      inference_time: 0, execution_time: 0, total_time: dt,
      tokens: tokenD, evidence: null, image: null, noop: false
    });
  });

  let totalTokens = Math.trunc(num(finishUsage.total_tokens));
  if(!totalTokens) totalTokens = steps.reduce((a, s) => a + s.tokens.input + s.tokens.output, 0);
  const totalTime = finishTime ?? prevT;
  const graphSteps = finishSteps || new Set(steps.filter(s => s.step > 0).map(s => s.step)).size;
  const avg = graphSteps ? totalTime / graphSteps : 0;

  return {
    task_dir: stem, session_id: stem, task: stem,
    status: status,
    stats: {
      total_steps: graphSteps,
      total_time: Math.round(totalTime * 10) / 10,
      total_tokens: totalTokens,
      avg_step: Math.round(avg * 100) / 100
    },
    steps: steps
  };
}

// 一次解析出概要 + 明细（离线版一次性都拿到，不用再请求接口）
function parseLog(stem, text){
  const evs = parseEvents(text);
  return {
    summary: buildSummary(stem, evs, nonEmptyLines(text)),
    detail:  buildDetail(stem, evs)
  };
}
/*__CORE_END__*/

// ============================================================
// UI 层
// ============================================================
const $ = (s) => document.querySelector(s);

const FILES  = [];   // [{stem, file}]  保留 File 句柄，便于「重新读取」
const TASKS  = [];   // 概要列表（按名字倒序）
const DETAIL = {};   // stem -> detail

function setInfo(t){ $('#pickInfo').textContent = t; }

function emptyState(msg){
  $('#stats').innerHTML = '';
  $('#timeline').innerHTML = `
    <div class="empty">
      <svg id="bean" class="state-idle" viewBox="0 0 64 56">
        <path d="M16 23 L18.5 9 L30.5 17 Z" fill="#ffc26b" stroke="#e8a44e" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M48 23 L45.5 9 L33.5 17 Z" fill="#ffc26b" stroke="#e8a44e" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="32" cy="31" r="17.5" fill="#ffc26b" stroke="#e8a44e" stroke-width="1.2"/>
        <path d="M32 16.5 C41.5 16.5 46 23 46 30.5 C46 39.5 40 46 32 46 C24 46 18 39.5 18 30.5 C18 23 22.5 16.5 32 16.5 Z" fill="#fff6e3"/>
        <path d="M16 26 Q32 16 48 26" stroke="#f0b429" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <circle cx="32" cy="20.4" r="2.1" fill="#ffd23f" stroke="#e0a800" stroke-width="0.9"/>
        <circle cx="25.5" cy="32" r="3" fill="#2b2b2b"/>
        <circle cx="38.5" cy="32" r="3" fill="#2b2b2b"/>
        <path d="M29.5 36.2 L34.5 36.2 L32 38.7 Z" fill="#ff8a80"/>
        <path d="M27.5 40.5 Q32 43.6 36.5 40.5" stroke="#2b2b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
      ${msg}
    </div>`;
}

function renderTaskList(){
  const sel = $('#taskSel');
  sel.innerHTML = '';
  TASKS.forEach(t => {
    const o = document.createElement('option');
    o.value = t.task_dir;
    o.textContent = `${t.task_dir} | ${t.status==='done'?'✅':(t.status==='aborted'?'⚠️':'⏳')} ${t.total_steps}步 · ${t.total_time}s · ${t.total_tokens} token`;
    sel.appendChild(o);
  });
  if(TASKS.length){ sel.value = TASKS[0].task_dir; renderTask(TASKS[0].task_dir); }
}

function renderTask(stem){
  const d = DETAIL[stem];
  if(!d) return;
  $('#stats').innerHTML = `
    <div class="stat"><div class="k">任务</div><div class="v" style="font-size:14px">${esc(d.task)}</div></div>
    <div class="stat"><div class="k">状态</div><div class="v"><span class="badge ${d.status}">${d.status==='done'?'已完成':(d.status==='aborted'?'已中止':'运行中')}</span></div></div>
    <div class="stat"><div class="k">步数</div><div class="v">${d.stats.total_steps}</div></div>
    <div class="stat"><div class="k">任务总耗时</div><div class="v">${d.stats.total_time}s</div></div>
    <div class="stat"><div class="k">平均步耗时</div><div class="v">${d.stats.avg_step}s</div></div>
    <div class="stat"><div class="k">总 Token</div><div class="v">${d.stats.total_tokens}</div></div>
  `;

  const tl = $('#timeline');
  tl.innerHTML = '';
  if(!d.steps.length){ tl.innerHTML = '<div class="empty">该日志没有可回放的事件</div>'; return; }

  let previousGraphStep = null;
  d.steps.forEach(s => {
    if(previousGraphStep !== s.step){
      const heading = document.createElement('div');
      heading.className = 'phase-group';
      heading.textContent = s.step === 0 ? '任务准备' : `第 ${s.step} 步`;
      tl.appendChild(heading);
      previousGraphStep = s.step;
    }
    const a = s.action || {};
    const explain = a.explain ? `<div class="meta"><b>说明：</b>${esc(a.explain)}</div>` : '';
    const detail = Object.entries(a)
      .filter(([k]) => !['action','summary','explain','decision_source','_tool_call_id','_from_tool','chinese_resolved','typed_value'].includes(k))
      .map(([k,v]) => `<b>${esc(k)}:</b> ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}`)
      .join(' · ');
    const noop = s.noop ? `<div class="noop">⚠️ 上一步点击后界面无变化</div>` : '';
    const card = document.createElement('div');
    card.className = 'card p-' + esc(a.action || 'log');
    card.innerHTML = `
      <div class="body">
        <div class="row1">
          <span class="step-no">事件 ${s.substep}</span>
          <span class="atype a-${esc(a.action||'')}">${esc(a.action||'?')}</span>
          <span class="timing">${s.wall_time ? s.wall_time + '  cost:' + s.total_time + 's' : 't+' + s.total_time + 's'}</span>
          ${a.decision_source?`<span class="badge" style="background:#e0e7ff;color:#3730a3">${esc(a.decision_source)}</span>`:''}
        </div>
        ${detail?`<div class="meta">${detail}</div>`:''}
        ${explain}
        <div class="timing">token ${ (s.tokens.input||0)+(s.tokens.output||0) }（入 ${s.tokens.input} / 出 ${s.tokens.output}）</div>
        ${noop}
      </div>`;
    tl.appendChild(card);
  });
}

// 从 File 对象列表解析
async function loadFromFiles(fileList){
  const jls = Array.from(fileList).filter(f => /\.jsonl$/i.test(f.name));
  if(!jls.length){
    setInfo('未找到 .jsonl');
    emptyState('没找到 <code>.jsonl</code> 文件。日志在 <code>server/autogui/artifacts/logs</code>，请选那个文件夹。');
    return;
  }
  FILES.length = 0;
  TASKS.length = 0;
  Object.keys(DETAIL).forEach(k => delete DETAIL[k]);

  for(const f of jls){
    const stem = f.name.replace(/\.jsonl$/i, '');
    FILES.push({stem: stem, file: f});
  }
  await parseAll();
}

// 重新读取已选文件（日志更新后不用重选）
async function parseAll(){
  TASKS.length = 0;
  Object.keys(DETAIL).forEach(k => delete DETAIL[k]);
  for(const it of FILES){
    let text = '';
    try { text = await it.file.text(); } catch(e) { continue; }
    const r = parseLog(it.stem, text);
    TASKS.push(r.summary);
    DETAIL[it.stem] = r.detail;
  }
  TASKS.sort((a, b) => a.task_dir < b.task_dir ? 1 : -1);   // 名字倒序，对齐后端口径
  renderTaskList();
  if(!TASKS.length) emptyState('日志解析失败或为空');
  else setInfo(`已加载 ${TASKS.length} 个任务日志`);
}

// ---- 选择 / 拖拽 ----
$('#pickDirBtn').onclick  = () => $('#dirInput').click();
$('#pickFileBtn').onclick = () => $('#fileInput').click();
$('#dirInput').onchange   = e => loadFromFiles(e.target.files);
$('#fileInput').onchange  = e => loadFromFiles(e.target.files);
$('#loadBtn').onclick     = () => renderTask($('#taskSel').value);
$('#reloadBtn').onclick   = () => { if(FILES.length) parseAll(); else setInfo('还没选文件'); };
$('#taskSel').onchange    = e => renderTask(e.target.value);

// 拖拽（支持拖文件夹）
function readAllEntries(reader){
  return new Promise(resolve => {
    const all = [];
    const step = () => reader.readEntries(batch => {
      if(!batch.length) return resolve(all);
      all.push(...batch); step();
    });
    step();
  });
}
async function walkEntry(entry, out){
  if(entry.isFile){ out.push(entry); return; }
  if(entry.isDirectory){
    const ents = await readAllEntries(entry.createReader());
    for(const e of ents) await walkEntry(e, out);
  }
}
const pickbar = $('#pickbar');
['dragenter','dragover'].forEach(ev => pickbar.addEventListener(ev, e => {
  e.preventDefault(); pickbar.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => pickbar.addEventListener(ev, e => {
  e.preventDefault(); pickbar.classList.remove('drag');
}));
pickbar.addEventListener('drop', async e => {
  const items = e.dataTransfer.items;
  if(items && items.length && items[0].webkitGetAsEntry){
    const entries = [];
    for(const it of items){ const en = it.webkitGetAsEntry(); if(en) entries.push(en); }
    const files = [];
    for(const en of entries) await walkEntry(en, files);
    const real = await Promise.all(files.map(f => new Promise(res => f.file(res))));
    loadFromFiles(real);
  } else {
    loadFromFiles(e.dataTransfer.files);
  }
});
