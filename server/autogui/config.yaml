# Automotive GUI Agent —— 运行时配置。
# 这里所有键都是可选的，默认值在 autogui/config.py 中。

# local = LangGraph 在进程内直接调用 bridge/tools.py 的函数。
# mcp   = 同样的调用走一个真实的 MCP 会话（对端是 autogui/mcp_server.py）。
# 如果 Demo Day 当天 MCP 链路出问题，把它改回 local 即可：10 秒钟，不用重构。
exec_mode: local

device_serial: auto        # auto = 自动选唯一在线设备，否则直接报错
display_id: null           # 保持 null；仅当 `--check` 报告多屏且
                            # 捕获到的不是中控屏时才设置
input_chain: [yadb, adbkeyboard, ascii]

# 默认按实际截图尺寸自动计算。cols/rows 是勾选手动覆盖后的备用值：
# 1920x1080 下 20x10 约为 96x108px/格。
grid:
  mode: "auto" # 默认按实际截图尺寸计算；前端勾选手动设置时改为 manual
  cols: 20
  rows: 10
  jpeg_quality: 85
  max_side: 1568           # 暂定值；LightGUIAgent 把它写死为“Claude 最优”
                            # —— 9/19 A/B 测试中针对 GLM 重新实测

agent:
  max_steps: 20
  wall_clock_limit: 480    # 秒；Demo Day 一个任务的时间槽总共 8 分钟
                           # （原 180 实测不够：B 站任务 8 步就要 212s，模型单次决策 4~10s）
  no_progress_limit: 3     # 屏幕指纹连续不变的步数
  delay_after_action: 1.0
  history_window: 5
  token_budget: 8000       # 近似输入 token 数，超过后触发裁剪
  tree_candidate_limit: 40
  reflection: cheap        # cheap = 仅当屏幕看起来没变化时才花一次 VLM 调用
                           # always = 完全对齐 Mobile-Agent-v2（≈4 次/步；不要以此发布）
                           # off    = 最快，但完全失去恢复行为

skills:
  enabled: true
  directory: skills

# 讯飞流式听写（章程 §4.6 加分项）：语音输入通道，可插拔，主循环不依赖
# 凭证不写明文/不提交密文（DPAPI 密文绑机器，队友解不开）：入库版本一律留空。
# 每台机器本地录入（getpass 不回显，加密写入本机 config.yaml，见 autogui/security.py）：
#   python -m autogui.security set voice.appid
#   python -m autogui.security set voice.api_key
#   python -m autogui.security set voice.api_secret
# 或设置环境变量 IFLYTEK_APPID / IFLYTEK_API_KEY / IFLYTEK_API_SECRET。
voice:
  appid: "ad8987fe" # python -m autogui.security set voice.appid
  api_key: "dc1a6fb17594d12d553a42ce745d23e2" # 留空 → 回退 IFLYTEK_API_KEY 环境变量；录入：python -m autogui.security set voice.api_key
  api_secret: "ENC()" # python -m autogui.security set voice.api_secret
  iat_url: "wss://iat-api.xfyun.cn/v2/iat" # 留空 = 讯飞公网 wss://iat-api.xfyun.cn/v2/iat
  max_seconds: 15.0 # 最长录音秒数
  silence_seconds: 0.8 # 尾部连续静音后自动停止
  silence_threshold: 120 # 静音判定 RMS 阈值（实测底噪<90，说话200~540）

glm:
  model: "ts-glm-53-flash"
  base_url: "https://llm.thundersoft.com"
  api_key: "ENC()" # 留空 → 回退 GLM_API_KEY 环境变量（我们的 ThunderSoft 官方 key）
  api_key_env: GLM_API_KEY
  temperature: 0.1
  max_tokens: 8192 # 【标记：ts-glm-53-flash 思维链模型，需单独适配】思维链也计入
                      # completion_tokens：2048 容易被思维链吃满 → 输出截断/空响应
                      # （9/28 美团外卖任务实测 2 次 empty completion，重试各多花 15~32s）。
                      # 已提升至 4096；若仍出现截断，继续上调并观察单步耗时。
  timeout: 60.0 # 正常决策实测 5~30s；60s 上限既覆盖慢响应，又让挂死请求
                      # 尽快超时进入重试（120s 时单步挂死会直接吃掉整个任务预算）
  max_retries: 4 # 网关间歇故障会伪装成 400 roles/超时且可自愈：指数退避 1/2/4/8s，共 5 次撞健康实例

# 范围由规则 4.2 固定：CEA1.3 预装集 + 哔哩哔哩 / 飞书 / 外卖。
# 借到车机后用 `python main.py --packages` 填包名——
# LightGUIAgent 提示词里的 App 列表（美团/淘宝/微信）是手机端的，在车机上大多不适用。
# 设置页维护目标应用清单；--check 核对全部目标包名，任务开始时模型可选择 ADB 直启。
app_cache_serial: "509c27fd"
apps:
  - name: QQ音乐
    aliases: ["qqmusic"]
    package:
  - name: 哔哩哔哩
    aliases: ["bili", "bilibili"]
    package:
  - name: 飞书
    aliases: ["feishu", "lark"]
    package:
  - name: 美团
    aliases: ["meituan"]
    package:
log_dir: artifacts/logs
verbose: true

# 细粒度日志开关（截图/XML/GLM交互落盘）；诊断时改为true
debug: true
