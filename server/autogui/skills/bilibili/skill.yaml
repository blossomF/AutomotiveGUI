# 哔哩哔哩车机版
name: bilibili
configured_app: 哔哩哔哩
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「哔哩哔哩」的 package

skills:
  - name: play_video
    summary: 在 B 站按用户指定的标题、内容、封面或顺序选择并播放视频
    params: [video]
    guide: |
      适用于用户要求在 B 站播放视频，选片条件为：{video}。不要把其他 App 的播放请求或仅要求读取视频信息的任务当成此技能。
      根据用户条件和当前界面选择路径：用户指定首页推荐、当前列表或某个封面时，在对应页面查找；用户明确要求搜索，或未限定页面且需按标题、内容查找时，再进入搜索并输入相关关键词，不要把整段选片指令当作搜索词。
      按用户指定的标题、内容、作者、封面或位置条件匹配视频；只有用户明确要求“第一个”时才按对应页面当前顺序选择第一个，不默认播放首个推荐或首个搜索结果。
      封面条件必须依据截图确认，标题和作者以实际可见信息为准；当前观察不足以确认时继续查找或如实说明，不能猜测匹配。
      进入视频页后核对所选视频符合用户条件且已开始播放，再判断播放目标完成；仅打开详情页不等于已播放。结果不符时返回重新选择，不擅自播放其他视频。
