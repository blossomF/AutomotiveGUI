# 美团外卖
name: meituan
configured_app: 美团
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「美团」的 package

# App 级弹窗覆盖项；省略则用 base.py 的 DEFAULT_POPUPS。
skills:
  - name: search_and_add
    summary: 搜索指定商品并加入购物车
    params: [item]
    guide: |
      适用于用户明确要求在外卖应用寻找 {item} 并加入购物车。先核对目标店铺、商品和规格；用户说“第一家店”时按当前搜索排序选择第一家。
      找到商品后加入购物车，并核对购物车中商品名称、数量和店铺。加入购物车不等于下单；未经用户明确要求不要提交订单或付款。
      商品或店铺不符时继续查找，不要因为点击过“加入购物车”就报告完成。
