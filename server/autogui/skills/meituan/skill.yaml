# 美团外卖
name: meituan
configured_app: 美团
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「美团」的 package

# App 级弹窗覆盖项；省略则用 base.py 的 DEFAULT_POPUPS。
skills:
  - name: search_and_add
    summary: 搜索指定商品
    params: [item]
    guide: |
      适用于用户明确要求在外卖应用寻找 {item} 。先核对目标店铺、商品和规格；用户说“第一家店”时按当前搜索排序选择第一家。
      找到商品后根据用户指示操作。
