# 音乐（CEA1.3 预装）
name: music
configured_app: QQ音乐
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「QQ音乐」的 package

# App 级弹窗覆盖项；省略则用 autogui/skills/base.py 的 DEFAULT_POPUPS。
skills:
  - name: play_song
    summary: 在音乐 App 按歌名或歌手搜索并播放
    params: [song]
    guide: |
      适用于用户要求在音乐应用按歌名或歌手 {song} 搜索并播放。先确认当前应用和页面；需要时从可用应用列表启动音乐应用。
      找到搜索入口；先聚焦输入框，再用 TYPE 一次输入完整中文原文。已知输入框编号时填写 node_ref。搜索歌手时从该歌手的结果中选曲，不要把歌手当成歌曲名。
      点击目标歌曲后，确认播放页显示正确曲目、歌手且处于播放状态，才可报告完成。找不到时不要猜测或播放其它歌曲。
  - name: pause
    summary: 暂停当前播放
    guide: |
      仅在用户明确要求暂停当前音乐时使用。先确认处于音乐播放界面且正在播放，找到对应的暂停控件。
      点击后检查播放状态确已暂停；如果已暂停，不要再次点击以免恢复播放。
