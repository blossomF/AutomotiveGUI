# 音乐（CEA1.3 预装）
# hint 的文本值在借到车机实测前都是占位符：
# 先运行 `python main.py --dump-report`，再把每个 hint 换成
# 该 App UI 树里真实出现的字符串。解析不了的 hint 会抛 SkillMiss，
# 该步落回通用 tree/vlm 路由——所以错误的 hint 只花掉一轮，不会让任务失败。
name: music
app:
  package: ""            # 用 `python main.py --packages` 填

# App 级弹窗覆盖项；省略则用 autogui/skills/base.py 的 DEFAULT_POPUPS。
popups:
  - { detect: "用户协议", button: "同意" }
  - { detect: "开启推送", button: "以后再说" }

skills:
  - name: play_song
    summary: 在音乐 App 搜索指定歌曲并播放（对应 Easy 参考任务）
    triggers: [播放, 来一首, 听一下, play]
    params: [song]
    steps:
      - { act: launch }
      - { act: dismiss_popups }
      - { act: click, hint: { text: "搜索" } }
      - { act: type, arg: song, clear_first: true }
      - { act: wait_for, arg: song, timeout: 8 }
      - { act: click, hint: { text: "{song}" } }   # {param} = 从 params 替换
      - { act: sleep, seconds: 1.5 }
      - { act: click, hint: { text: "播放全部" } }
      - { act: complete }

  - name: pause
    summary: 暂停当前播放
    triggers: [暂停]
    steps:
      - { act: click, hint: { desc: "暂停" } }
      - { act: complete }
