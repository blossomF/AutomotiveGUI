# 飞书
# 章程参考任务涉及"读消息→设日程"跨应用场景，这里先只覆盖单应用基础技能。
name: feishu
configured_app: 飞书
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「飞书」的 package

skills:
  - name: send_message
    summary: 给指定联系人发送一条文字消息
    params: [contact, text]
    guide: |
      仅在用户任务要求通过飞书给 {contact} 发送消息时使用；发送内容为 {text}。
      联系人和正文可来自用户指令，或用户要求读取并使用的已观察信息。正文来自其他应用时，保留原文并在 explain 中注明来源应用、页面或观察步骤；不要把猜测当作正文。
      找到并核对联系人，再输入消息。发送前检查收件人和文本均准确，避免发给同名联系人或发送额外内容。
      发送后以聊天界面中的实际消息为完成证据。用户只是要求阅读消息、建日程或导航时，不要发送消息。
  - name: open_chat
    summary: 打开与指定联系人的聊天窗口
    params: [contact]
    guide: |
      适用于用户明确要求查看飞书联系人 {contact} 的聊天。先核对联系人身份，再打开对应会话。
      如需读取消息，仅根据屏幕上可见内容提取信息；不要擅自回复或发送消息。
  - name: create_event
    summary: 在飞书日历创建一条日程
    params: [title, time]
    guide: |
      仅在用户任务要求在飞书中创建日程/会议/提醒时使用；日程主题为 {title}。
      主题和时间可来自用户指令，或用户要求读取并用于创建日程的已观察信息；后者需在 explain 中注明来源应用、页面或观察步骤，不编造缺失信息。
      流程：进入底部「日历」页 → 点右下角「+」新建（append_event）→
      在「添加主题」输入框写入主题 → 按用户要求设置时间/地点/提醒/参与者 → 核对后点右上角「保存」。
      时间参数 {time} 是用户要求的目标时间，必须按原要求设置；只有当前表单时间已与目标一致时才可保持原值。
      时间选择器的选中值可能只能从截图读取，按当前界面和场景指导逐步调整。点击「完成」后，重新核对表单中的日期与时间。
      无法设置或确认目标时间时，如实说明具体阻碍；不要擅自保存默认时间或其他时间，也不要用消息中的说明代替正确设置日程。
      地点点「添加地点」后输入；描述点「添加描述」后输入。保存前核对主题、时间及用户指定的其他字段；保存后在详情页确认这些内容与用户要求一致，才可报告完成。
      不要重复点保存，不要顺手创建会议群或视频会议。用户只是要查看日程时不要创建。
