# 飞书
# 注意：以下 hint 均为占位符，需在真机运行 `python main.py --dump-report` 后，
# 替换为该 App UI 树里真实出现的字符串。
# 章程参考任务涉及"读消息→设日程"跨应用场景，这里先只覆盖单应用基础技能。
name: feishu
configured_app: 飞书
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「飞书」的 package

popups:
  - { detect: "用户协议", button: "同意" }
  - { detect: "通知", button: "以后再说" }

skills:
  - name: send_message
    summary: 给指定联系人发送一条文字消息
    params: [contact, text]
    guide: |
      仅在用户明确要求通过飞书给 {contact} 发送消息时使用；消息内容必须来自用户原话：{text}。
      找到并核对联系人，再输入消息。发送前检查收件人和文本均准确，避免发给同名联系人或发送额外内容。
      发送后以聊天界面中的实际消息为完成证据。用户只是要求阅读消息、建日程或导航时，不要发送消息。
    steps:
      - { act: launch }
      - { act: dismiss_popups }
      - { act: click, hint: { text: "消息" } }
      - { act: click, hint: { text: "搜索" } }
      - { act: type, arg: contact, clear_first: true }
      - { act: wait_for, arg: contact, timeout: 8 }
      - { act: click, hint: { text: "{contact}" }, nth: 0 }
      - { act: sleep, seconds: 1.5 }
      - { act: click, hint: { desc: "输入消息" } }
      - { act: type, arg: text, clear_first: true }
      - { act: click, hint: { desc: "发送" } }
      - { act: sleep, seconds: 1.0 }
      - { act: complete }

  - name: open_chat
    summary: 打开与指定联系人的聊天窗口
    params: [contact]
    guide: |
      适用于用户明确要求查看飞书联系人 {contact} 的聊天。先核对联系人身份，再打开对应会话。
      如需读取消息，仅根据屏幕上可见内容提取信息；不要擅自回复或发送消息。
    steps:
      - { act: launch }
      - { act: dismiss_popups }
      - { act: click, hint: { text: "消息" } }
      - { act: click, hint: { text: "搜索" } }
      - { act: type, arg: contact, clear_first: true }
      - { act: wait_for, arg: contact, timeout: 8 }
      - { act: click, hint: { text: "{contact}" }, nth: 0 }
      - { act: sleep, seconds: 1.5 }
      - { act: complete }
