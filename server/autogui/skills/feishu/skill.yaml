# 飞书
# 章程参考任务涉及"读消息→设日程"跨应用场景，这里先只覆盖单应用基础技能。
name: feishu
configured_app: 飞书
# 包名不写在这里：统一取 config.yaml apps 段（设置页设备探测）中「飞书」的 package

skills:
  - name: send_message
    summary: 给指定联系人发送一条文字消息
    params: [contact, text]
    guide: |
      仅在用户明确要求通过飞书给 {contact} 发送消息时使用；消息内容必须来自用户原话：{text}。
      找到并核对联系人，再输入消息。发送前检查收件人和文本均准确，避免发给同名联系人或发送额外内容。
      发送后以聊天界面中的实际消息为完成证据。用户只是要求阅读消息、建日程或导航时，不要发送消息。
  - name: open_chat
    summary: 打开与指定联系人的聊天窗口
    params: [contact]
    guide: |
      适用于用户明确要求查看飞书联系人 {contact} 的聊天。先核对联系人身份，再打开对应会话。
      如需读取消息，仅根据屏幕上可见内容提取信息；不要擅自回复或发送消息。
  - name: create_event
    summary: 在飞书日历创建一条日程
    params: [title, time]
    guide: |
      仅在用户明确要求在飞书中创建日程/会议/提醒时使用；日程主题必须来自用户原话：{title}。
      流程：进入底部「日历」页 → 点右下角「+」新建（append_event）→
      在「添加主题」输入框写入主题 → 如需调整时间/地点/提醒/参与者再逐项设置 → 点右上角「保存」。
      时间参数 {time}：用户指定的时间（如"19:00"）。注意：时间选择器是三列自定义滚轮（日期/时/分），
      无文本节点，当前技能无法自动设置时间，将保持默认值（当前时刻起半小时）。
      如需设置指定时间，需手动操作滚轮：点击时间区域打开选择器，在中列（小时）和右列（分钟）滚动到目标值，
      然后点击右上角「完成」。但滚轮操作不精确，成功率低，建议保持默认时间并在消息中说明实际时间。
      地点点「添加地点」后输入；描述点「添加描述」后输入。保存后进入日程详情页、看到主题与时间信息即为成功；
      不要重复点保存，不要顺手创建会议群或视频会议。用户只是要查看日程时不要创建。
