[project]
name = "autogui"
version = "0.1.0"
description = "Automotive GUI Agent — CART Q3 AI Contest. LangGraph brain + thin MCP executor + own ADB bridge."
requires-python = ">=3.10"
readme = "README.md"

# 运行时依赖刻意冻结在 6 个（见 技术方案评估.md §6）。
# Demo Day 的复现性值 10 分，每多一个依赖都会在那里耗时间。
dependencies = [
  "mcp>=1.2,<2",
  "langgraph>=0.2,<0.3",
  "openai>=1.40",          # GLM 5.3 走 OpenAI 兼容协议
  "pillow>=10",
  "pyyaml>=6",
  "pydantic>=2.7",
  "pypinyin>=0.51",       # 中文输入兜底：拼音首字母简写（ascii 降级时）
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# 语音输入（章程 §4.6 加分 +3）：独立可选组，核心 6 依赖保持不变
voice = ["sounddevice>=0.4", "websocket-client>=1.6"]

[project.scripts]
autogui = "main:main"
autogui-mcp = "autogui.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["autogui*"]

[tool.setuptools.package-data]
"autogui.brain" = ["prompt_text.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
