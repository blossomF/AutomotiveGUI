picker_guide: |-
  当前有可读数值滚轮。要设定目标值时用 ROLL_TO(node_ref,target,delta_units?)；target 保留单位，如 19时、00分。根据候选当前值计算 delta_units=目标值-当前值，不要猜像素或用 DRAG 跨越滚轮边界。执行器会短滑、读取新值并修正；达标后另行点击确认，并核对表单。
