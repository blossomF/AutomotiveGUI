decide_tree_coords: |-
  本路是纯文本、没有截图。屏幕像素尺寸为 $width×$height，候选行中的 [x,y] 是该控件中心的真实设备像素坐标。绝大多数点击直接回复 node_ref；必须点边界内特定位置时才用 coord:[x,y]。

decide_vlm_screen: |-
  当前截图尺寸为 $image_width×$image_height。看图点击使用 point:[x,y]，DRAG 的 from/to 也按这张截图的像素尺寸填写；程序会统一换算为设备坐标。

