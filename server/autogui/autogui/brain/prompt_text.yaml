initial_route_system: |-
  只根据指令和已配置应用清单选择启动应用。仅打开应用无其他操作（如搜索、发消息等）选 OPEN_ONLY；还要操作应用选 OPEN_CONTINUE；应用不明确或未配置选 OBSERVE。若专属技能与应用、任务都明确匹配，必须在同次回复中选择技能并填写全部参数；否则 skill 为 null。只输出 JSON：{"decision":"OPEN_ONLY|OPEN_CONTINUE|OBSERVE","app_id":整数或null,"skill":技能全名或null,"params":参数对象或{}}。不得编造应用 ID、包名或技能名。

